<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruler Intelligence — Banking Regulatory Platform</title>
  <meta http-equiv="refresh" content="0; url=http://localhost:3000/">
  <script>
    // Immediate redirect to modern Next.js frontend
    if (window.location.port === '8000') {
      window.location.href = 'http://localhost:3000/';
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #FAF8F5;
      color: #002147;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #FFFFFF;
      border: 1px solid #D8CCBD;
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 12px rgba(0, 33, 71, 0.05);
      text-align: center;
      display: flex;
      flex-col;
      flex-direction: column;
      gap: 16px;
    }
    .logo {
      padding: 6px 16px;
      background-color: #002147;
      color: #D2B48C;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 0.05em;
      margin: 0 auto;
    }
    h1 { font-size: 20px; font-weight: 700; color: #002147; }
    p { font-size: 13px; color: #6A5A4A; line-height: 1.5; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .btn-primary {
      background-color: #002147;
      color: #D2B48C;
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 13px;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary {
      background-color: #F5EFEB;
      color: #002147;
      border: 1px solid #D8CCBD;
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 13px;
    }
    .btn-secondary:hover { background-color: #D2B48C; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">RULER</div>
    <h1>Ruler Intelligence Platform</h1>
    <p>The modern application runs on port <strong>3000</strong>. Redirecting you to the active dashboard...</p>
    <div class="btn-group">
      <a href="http://localhost:3000/" class="btn-primary">Open User Portal (http://localhost:3000/) →</a>
      <a href="http://localhost:3000/ruler" class="btn-secondary">Open Admin Console (http://localhost:3000/ruler) →</a>
    </div>
  </div>
</body>
</html>
